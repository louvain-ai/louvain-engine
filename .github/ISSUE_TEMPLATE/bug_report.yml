name: Bug report
description: Something the engine does that it should not, or does not do that it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran and its output
      description: The `./engine` command (or the tool call) and everything it printed. Remove anything private first.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Engine version
      description: The release, or the commit you are on (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker and Compose versions
      description: "`docker --version` and `docker compose version`."
