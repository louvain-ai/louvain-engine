version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /apps/nlp
    schedule: { interval: weekly }
    groups:
      pip:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /apps/nlp
    schedule: { interval: weekly }
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
