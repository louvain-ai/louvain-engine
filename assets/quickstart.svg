<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="20" y="71" fill="#c4b5fd" xml:space="preserve">$ ./engine up</text>
<text x="20" y="91" fill="#e5e7eb" xml:space="preserve">Installing (the lockfile pins every version)...</text>
<text x="20" y="111" fill="#e5e7eb" xml:space="preserve">Building the workspace packages...</text>
