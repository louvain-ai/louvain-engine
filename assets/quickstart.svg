<text x="20" y="271" fill="#e5e7eb" xml:space="preserve">Ready.</text>
<text x="20" y="291" fill="#c4b5fd" xml:space="preserve">$ ./engine ingest folder --folder examples/sample-corpus</text>
<text x="20" y="311" fill="#e5e7eb" xml:space="preserve">ingesting examples/sample-corpus into &quot;sample-corpus&quot;</text>
