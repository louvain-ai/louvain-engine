<text x="20" y="171" fill="#e5e7eb" xml:space="preserve">Reranker: off (engine.config.ts names none).</text>
<text x="20" y="191" fill="#e5e7eb" xml:space="preserve">Schema: loaded.</text>
<text x="20" y="211" fill="#e5e7eb" xml:space="preserve">Tools: http://127.0.0.1:8080/mcp</text>
<text x="20" y="231" fill="#e5e7eb" xml:space="preserve">App:   http://127.0.0.1:8080/app/</text>
