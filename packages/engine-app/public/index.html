        <p class="search-said visually-hidden" role="status"></p>
        <div class="results" aria-busy="false"></div>
      </section>

      <section class="view view-ask" id="view-ask" aria-label="Ask" hidden>

        <div class="dock">
          <form class="composer">
            <textarea class="composer-input" name="question" rows="1" placeholder="Ask about your documents" aria-label="Your question" enterkeyhint="send"></textarea>
            <button class="send" type="submit" aria-label="Ask">

          </form>
        </div>
      </section>
